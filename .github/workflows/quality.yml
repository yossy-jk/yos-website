name: Website quality and security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security, accessibility, brand, lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm test

      - name: Scan source for credentials
        run: npm run scan:credentials

      - name: Enforce Brand Standard v1.1
        run: npm run check:brand

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Build production bundle
        run: npm run build

      - name: Run axe accessibility gate
        run: npm run test:axe

      - name: Run responsive composition gate
        run: npm run test:responsive

      - name: Capture visual QA evidence
        run: |
          npx next start --hostname 127.0.0.1 --port 3102 > /tmp/yos-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3102/ > /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/yos-preview.log; exit 1; fi
            sleep 1
          done
          node scripts/screenshot.mjs http://127.0.0.1:3102

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-qa-${{ github.sha }}
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
