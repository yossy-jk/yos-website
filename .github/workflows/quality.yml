name: Website quality and security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Credential scan, lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run security regression tests
        run: npm test

      - name: Scan source for credentials
        run: npm run scan:credentials

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Build production bundle
        run: npm run build
